name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write
  # Required by actions/attest-build-provenance to mint a Sigstore
  # cert tied to this workflow run.
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Provenance attestations for the binary assets BRAT and the
      # Obsidian community store fetch. Lets anyone verify the
      # main.js / styles.css they downloaded came from this repo at
      # this commit, without trusting the release page metadata.
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            styles.css

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          # Notes file is written by publish-release.mjs from the dev
          # repo; it's part of the public tree so the Action can read it
          # directly without any other inputs.
          body_path: release-notes/${{ github.ref_name }}.md
          # Land as a draft so the notes can be reviewed before customers
          # see it. Publish manually from the Releases page when ready.
          draft: true
          files: |
            main.js
            manifest.json
            styles.css
