name: Release
run-name: Publish Butter Editor ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact bare release version
        required: true
        type: string
      candidate_sha:
        description: Exact reviewed commit already promoted to master and the version tag
        required: true
        type: string
      expected_tree_sha:
        description: Exact reviewed Git tree
        required: true
        type: string
      release_notes_sha256:
        description: SHA-256 of the reviewed public release notes
        required: true
        type: string
      main_js_sha256:
        description: SHA-256 of main.js
        required: true
        type: string
      manifest_json_sha256:
        description: SHA-256 of manifest.json
        required: true
        type: string
      styles_css_sha256:
        description: SHA-256 of styles.css
        required: true
        type: string

permissions: {}

concurrency:
  group: butter-editor-public-release
  cancel-in-progress: false

jobs:
  publish:
    name: Verify and publish exact reviewed release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Validate dispatch identity and exact inputs
        env:
          ACTOR_ID: ${{ github.actor_id }}
          VERSION: ${{ inputs.version }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          EXPECTED_TREE_SHA: ${{ inputs.expected_tree_sha }}
          RELEASE_NOTES_SHA256: ${{ inputs.release_notes_sha256 }}
          MAIN_JS_SHA256: ${{ inputs.main_js_sha256 }}
          MANIFEST_JSON_SHA256: ${{ inputs.manifest_json_sha256 }}
          STYLES_CSS_SHA256: ${{ inputs.styles_css_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          [[ "$GITHUB_ACTOR" == "Giblicious" && "$ACTOR_ID" == "57109738" ]] \
            || fail "The release was not dispatched by the approved owner."
          [[ "$GITHUB_REF" == "refs/heads/master" ]] \
            || fail "The release workflow must run from public master."
          [[ "$GITHUB_SHA" == "$CANDIDATE_SHA" ]] \
            || fail "The workflow commit differs from the reviewed release candidate."
          [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] \
            || fail "version must be canonical bare semver."
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ && "$EXPECTED_TREE_SHA" =~ ^[0-9a-f]{40}$ ]] \
            || fail "Commit and tree inputs must be full lowercase SHA-1 values."
          for digest in "$RELEASE_NOTES_SHA256" "$MAIN_JS_SHA256" "$MANIFEST_JSON_SHA256" "$STYLES_CSS_SHA256"; do
            [[ "$digest" =~ ^[0-9a-f]{64}$ ]] || fail "Artifact inputs must be full lowercase SHA-256 values."
          done

      - name: Checkout exact reviewed commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify refs, commit identity, notes, and release assets
        env:
          VERSION: ${{ inputs.version }}
          CANDIDATE_SHA: ${{ inputs.candidate_sha }}
          EXPECTED_TREE_SHA: ${{ inputs.expected_tree_sha }}
          RELEASE_NOTES_SHA256: ${{ inputs.release_notes_sha256 }}
          MAIN_JS_SHA256: ${{ inputs.main_js_sha256 }}
          MANIFEST_JSON_SHA256: ${{ inputs.manifest_json_sha256 }}
          STYLES_CSS_SHA256: ${{ inputs.styles_css_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          remote_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          master_actual="$(git ls-remote --refs "$remote_url" refs/heads/master | awk 'NR == 1 { print $1 }')"
          tag_actual="$(git ls-remote --refs "$remote_url" "refs/tags/$VERSION" | awk 'NR == 1 { print $1 }')"
          review_actual="$(git ls-remote --refs "$remote_url" refs/heads/review | awk 'NR == 1 { print $1 }')"
          [[ "$master_actual" == "$CANDIDATE_SHA" ]] || fail "Public master is not the reviewed release candidate."
          [[ "$tag_actual" == "$CANDIDATE_SHA" ]] || fail "The release tag is not the reviewed release candidate."
          [[ -z "$review_actual" ]] || fail "The temporary review branch still exists."
          [[ "$(git rev-parse HEAD)" == "$CANDIDATE_SHA" ]] || fail "Checkout differs from candidate_sha."
          [[ "$(git rev-parse 'HEAD^{tree}')" == "$EXPECTED_TREE_SHA" ]] || fail "Candidate tree differs from expected_tree_sha."
          [[ "$(git show -s --format=%s HEAD)" == "Release $VERSION" ]] || fail "Release commit subject changed."
          [[ -z "$(git show -s --format=%b HEAD)" ]] || fail "Release commit body must be empty."
          [[ "$(git show -s --format='%an <%ae>' HEAD)" == "Butter Editor <noreply@buttereditor.com>" ]] \
            || fail "Release commit author changed."
          [[ "$(git show -s --format='%cn <%ce>' HEAD)" == "Butter Editor <noreply@buttereditor.com>" ]] \
            || fail "Release commit committer changed."
          notes="release-notes/$VERSION.md"
          [[ -f "$notes" && ! -L "$notes" ]] || fail "Release notes are missing or unsafe."
          [[ "$(sha256sum "$notes" | awk '{ print $1 }')" == "$RELEASE_NOTES_SHA256" ]] \
            || fail "Release notes differ from the reviewed candidate."
          [[ "$(sha256sum main.js | awk '{ print $1 }')" == "$MAIN_JS_SHA256" ]] || fail "main.js hash changed."
          [[ "$(sha256sum manifest.json | awk '{ print $1 }')" == "$MANIFEST_JSON_SHA256" ]] || fail "manifest.json hash changed."
          [[ "$(sha256sum styles.css | awk '{ print $1 }')" == "$STYLES_CSS_SHA256" ]] || fail "styles.css hash changed."

      - name: Create, verify, and publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          notes="release-notes/$VERSION.md"
          assets=(main.js manifest.json styles.css)
          if ! gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$VERSION" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$VERSION" \
              --notes-file "$notes" \
              --draft \
              "${assets[@]}"
          fi
          release_json="$(gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" --json tagName,name,isDraft,isPrerelease,body,assets,author)"
          jq -e --arg version "$VERSION" '
            .tagName == $version
            and .name == $version
            and .isPrerelease == false
            and .author.login == "github-actions[bot]"
            and ([.assets[].name] | sort) == ["main.js", "manifest.json", "styles.css"]
          ' <<<"$release_json" >/dev/null || fail "Draft release metadata, assets, or publisher identity is not exact."
          [[ "$(jq -r '.body' <<<"$release_json")" == "$(cat "$notes")" ]] || fail "Draft release notes differ from the reviewed notes."
          download_dir="$(mktemp -d)"
          gh release download "$VERSION" --repo "$GITHUB_REPOSITORY" --dir "$download_dir"
          for asset in "${assets[@]}"; do
            cmp --silent "$asset" "$download_dir/$asset" || fail "Uploaded $asset differs from the reviewed candidate."
          done
          if [[ "$(jq -r '.isDraft' <<<"$release_json")" == "true" ]]; then
            gh release edit "$VERSION" --repo "$GITHUB_REPOSITORY" --draft=false
          fi
          final_json="$(gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" --json tagName,name,isDraft,isPrerelease,body,assets,author,url)"
          jq -e --arg version "$VERSION" '
            .tagName == $version
            and .name == $version
            and .isDraft == false
            and .isPrerelease == false
            and .author.login == "github-actions[bot]"
            and ([.assets[].name] | sort) == ["main.js", "manifest.json", "styles.css"]
          ' <<<"$final_json" >/dev/null || fail "Published release metadata, assets, or publisher identity is not exact."
          [[ "$(jq -r '.body' <<<"$final_json")" == "$(cat "$notes")" ]] || fail "Published release notes differ from the reviewed notes."
          echo "Published $(jq -r '.url' <<<"$final_json") as github-actions[bot]."
